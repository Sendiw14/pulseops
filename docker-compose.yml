services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pulseops
      POSTGRES_PASSWORD: pulseops
      POSTGRES_DB: pulseops_dev
    ports:
      - "5432:5432"
    volumes:
      - pulseops-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseops -d pulseops_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pulseops-postgres:
